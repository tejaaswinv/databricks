name: Validate shopping sessions
on:
  push:
    branches: [main, perf-shards512]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download official public test inputs
        run: |
          curl -fsSL --retry 3 'https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/starter-duckdb.zip' -o /tmp/starter.zip
          curl -fsSL --retry 3 'https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip' -o /tmp/generator.zip
          curl -fsSL --retry 3 'https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/dev-answer.zip' -o /tmp/answer.zip
          unzip -q /tmp/starter.zip
          unzip -q /tmp/generator.zip
          unzip -q /tmp/answer.zip
      - name: Build official generator
        run: |
          cargo --version
          cargo build --release --manifest-path generator/Cargo.toml
          generator/target/release/generate --seed 1 --events 1000000 --clicks 250000 --output dev
      - name: Inspect public generator hot-path shapes
        run: |
          echo '=== generated event sample ==='
          f=$(find dev/events -name '*.csv' | head -1); head -6 "$f"
          echo '=== generated click sample ==='
          f=$(find dev/clicks -name '*.csv' | head -1); head -6 "$f"
          echo '=== generator source hints ==='
          grep -R -n -E 'event_id|click_id|ingest_ts|base36|timestamp|duplicate' generator/src | head -100 || true
      - name: Inspect generator ID construction
        run: |
          echo '=== generator source files ==='
          find generator/src -maxdepth 2 -type f -print
          echo '=== ID-related generator source ==='
          grep -R -n -E 'base36|event|click|duplicate|dup|scram|permute|user' generator/src | head -400 || true
          echo '=== main source ==='
          sed -n '1,500p' generator/src/main.rs || true
      - name: Build submission image
        run: docker build --platform linux/amd64 -t shopping-sessions:latest .
      - name: Install official checker dependency
        run: python3 -m pip install --break-system-packages polars
      - name: Run 36 edge-case fixtures
        run: |
          CPUS=4 MEM=7g python3 starter-duckdb/scripts/run_fixtures.py starter-duckdb/fixtures -- sh starter-duckdb/scripts/docker_run.sh
      - name: Run official 1-million-event dev set
        run: |
          mkdir -p out
          IMAGE=shopping-sessions:latest CPUS=4 MEM=7g sh starter-duckdb/scripts/docker_run.sh dev out
          python3 starter-duckdb/scripts/compare.py out dev-answer
      - name: A/B benchmark current vs previous optimized commit
        run: |
          generator/target/release/generate --seed 7 --events 20000000 --clicks 5000000 --output bench
          git worktree add --detach /tmp/baseline 23e8ef23eaccd3d1b6f1208066bbd0c0a8a43990
          docker build --platform linux/amd64 -t shopping-sessions:baseline /tmp/baseline

          # Warm both images so timing is not dominated by first-read filesystem cache.
          rm -rf warm-current warm-base && mkdir warm-current warm-base
          env IMAGE=shopping-sessions:latest CPUS=4 MEM=7g sh starter-duckdb/scripts/docker_run.sh bench warm-current >/dev/null
          env IMAGE=shopping-sessions:baseline CPUS=4 MEM=7g sh starter-duckdb/scripts/docker_run.sh bench warm-base >/dev/null

          rm -rf bench-current bench-base && mkdir bench-current bench-base
          echo "=== current ==="
          /usr/bin/time -f 'CURRENT_WALL=%e' env IMAGE=shopping-sessions:latest CPUS=4 MEM=7g sh starter-duckdb/scripts/docker_run.sh bench bench-current
          echo "=== baseline ==="
          /usr/bin/time -f 'BASELINE_WALL=%e' env IMAGE=shopping-sessions:baseline CPUS=4 MEM=7g sh starter-duckdb/scripts/docker_run.sh bench bench-base
          python3 starter-duckdb/scripts/compare.py bench-current bench-base
